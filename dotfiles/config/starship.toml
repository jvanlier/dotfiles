"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$hostname\
[](bg:orange fg:red)\
$directory\
[](bg:yellow fg:orange)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:blue)\
$time\
[ ](fg:blue)\
$cmd_duration\
$line_break\
$character"""

palette = 'zenburn'

[os]
disabled = false
style = "bg:red fg:background"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[hostname]
ssh_only = true
style = "bg:red fg:background"
format = '[ $hostname ]($style)'

[username]
show_always = true
style_user = "bg:red fg:background"
style_root = "bg:red fg:background"
format = '[ $user]($style)'

[directory]
style = "bg:orange fg:background"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false
fish_style_pwd_dir_length = 1


[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:background bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:background bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:background bg:green)]($style)'

[bun]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:background bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:background bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:background bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:background bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:background bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:background bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:background bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:background bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:background bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $context) ](fg:background bg:blue)]($style)'


[time]
disabled = false
time_format = "%R"
style = "bg:blue"
format = '[[  $time ](fg:background bg:blue)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:blue)'
vimcmd_replace_symbol = '[❮](bold fg:blue)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:blue"
disabled = false
show_notifications = false
min_time_to_notify = 45000

# Colors from phha/zenburn.nvim, with darker text for contrast on colored sections.
[palettes.zenburn]
background = "#000000"
red = "#cc9393"
orange = "#dfaf8f"
yellow = "#f0dfaf"
green = "#9ece9e"
blue = "#8cd0d3"
